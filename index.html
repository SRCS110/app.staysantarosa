<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#272e1b" />
    <meta name="description" content="Santa Rosa · Sonoma Wine Country — a free, no-sign-in guide to downtown Santa Rosa for Art House and Hotel E guests. Dining, wine & beer, attractions and walks, with walking time from each hotel." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Stay Santa Rosa — City Guide</title>

    <link rel="stylesheet" href="/vendor/leaflet.css" />
    <link rel="stylesheet" href="/src/styles/organic.css" />
    <link rel="stylesheet" href="/src/styles/app.css" />

    <!-- No build step: browser-native ES modules + an import map. See /vendor. -->
    <script>window.__leafletReady = new Promise((r) => (window.__leafletResolve = r));</script>
    <script src="/vendor/leaflet.js" defer onload="window.__leafletResolve()"></script>
    <script type="importmap">
      {
        "imports": {
          "preact": "/vendor/preact.module.js",
          "preact/hooks": "/vendor/hooks.module.js",
          "htm": "/vendor/htm.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
